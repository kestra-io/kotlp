name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cosmocc toolchain
        uses: actions/cache@v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ hashFiles('Makefile') }}

      - name: Build APE
        run: make

      - name: Unit tests
        run: make test-unit

      - name: Smoke test (Linux)
        run: make test

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kotlp-ape
          path: |
            build/kotlp
            build/test-unit
          if-no-files-found: error

  crosstest:
    name: Run same binaries on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # The exact same APEs produced on Linux are executed unmodified here,
        # proving the "build once, run anywhere" property. macos-26 is arm64,
        # macos-26-intel is x64, so both macOS architectures are covered.
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: kotlp-ape
          path: build

      - name: Make executable
        run: chmod +x build/kotlp build/test-unit

      - name: Unit tests
        run: ./build/test-unit

      - name: Smoke test
        run: scripts/smoke_test.sh "$(pwd)/build/kotlp"

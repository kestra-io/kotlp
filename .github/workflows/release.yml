name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cosmocc toolchain
        uses: actions/cache@v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ hashFiles('Makefile') }}

      - name: Build
        run: make VERSION=${GITHUB_REF_NAME#v}

      - name: Unit tests
        run: make test-unit

      - name: Smoke test
        run: make test

      - name: Package artifacts
        run: |
          mkdir -p dist
          # The single APE: runs on Linux/macOS/Windows/BSD, amd64+arm64.
          cp build/kotlp dist/kotlp
          # Windows requires a .exe/.com extension to launch the same bytes.
          cp build/kotlp dist/kotlp.exe
          cd dist
          sha256sum kotlp kotlp.exe > SHA256SUMS
          echo "----- checksums -----"
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "kotlp ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/kotlp dist/kotlp.exe dist/SHA256SUMS

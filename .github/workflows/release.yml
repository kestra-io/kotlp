name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cosmocc toolchain
        uses: actions/cache@v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ hashFiles('Makefile') }}

      - name: Build
        run: make VERSION=${GITHUB_REF_NAME#v}

      - name: Unit tests
        run: make test-unit

      - name: Smoke test
        run: make test

      - name: Package artifacts
        run: |
          mkdir -p dist
          # The single APE: runs on Linux/macOS/Windows/BSD, amd64+arm64.
          cp build/kotlp dist/kotlp
          # Windows requires a .exe/.com extension to launch the same bytes.
          cp build/kotlp dist/kotlp.exe
          cd dist
          sha256sum kotlp kotlp.exe > SHA256SUMS
          echo "----- checksums -----"
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-runnable: if the release already exists (e.g. the Maven publish below failed and the
          # job is being retried), refresh its assets instead of failing before reaching that step.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber \
              dist/kotlp dist/kotlp.exe dist/SHA256SUMS
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "kotlp ${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/kotlp dist/kotlp.exe dist/SHA256SUMS
          fi

      # Maven Central: the same binary, wrapped in io.kestra:kotlp so JVM consumers resolve it as an
      # ordinary dependency (cached, checksummed, retried by Gradle) instead of fetching the release
      # asset over plain HTTP at build time.
      - name: Setup - JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Publish - Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_GPG_KEYID: ${{ secrets.SONATYPE_GPG_KEYID }}
          SONATYPE_GPG_PASSWORD: ${{ secrets.SONATYPE_GPG_PASSWORD }}
          SONATYPE_GPG_FILE: ${{ secrets.SONATYPE_GPG_FILE }}
        run: |
          mkdir -p ~/.gradle/
          echo "signing.keyId=${SONATYPE_GPG_KEYID}" > ~/.gradle/gradle.properties
          echo "signing.password=${SONATYPE_GPG_PASSWORD}" >> ~/.gradle/gradle.properties
          echo "signing.secretKeyRingFile=${HOME}/.gradle/secring.gpg" >> ~/.gradle/gradle.properties
          echo "${SONATYPE_GPG_FILE}" | base64 -d > ~/.gradle/secring.gpg
          ./gradlew publishToMavenCentral -Pversion="${GITHUB_REF_NAME#v}"

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cosmocc toolchain
        uses: actions/cache@v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ hashFiles('Makefile') }}

      - name: Build
        run: make VERSION=${GITHUB_REF_NAME#v}

      - name: Unit tests
        run: make test-unit

      - name: Smoke test
        run: make test

      - name: Package artifacts
        run: |
          mkdir -p dist
          # The single APE: runs on Linux/macOS/Windows/BSD, amd64+arm64.
          cp build/kotlp dist/kotlp
          # Windows requires a .exe/.com extension to launch the same bytes.
          cp build/kotlp dist/kotlp.exe
          cd dist
          sha256sum kotlp kotlp.exe > SHA256SUMS
          echo "----- checksums -----"
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-runnable: if the release already exists (e.g. the Maven publish below failed and the
          # job is being retried), refresh its assets instead of failing before reaching that step.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber \
              dist/kotlp dist/kotlp.exe dist/SHA256SUMS
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "kotlp ${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/kotlp dist/kotlp.exe dist/SHA256SUMS
          fi

      # Maven Central: the same binary, wrapped in io.kestra:kotlp so JVM consumers resolve it as an
      # ordinary dependency (cached, checksummed, retried by Gradle) instead of fetching the release
      # asset over plain HTTP at build time.
      - name: Setup - JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Publish - Prepare
        run: echo "ORG_GRADLE_PROJECT_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish - Maven Central
        uses: kestra-io/actions/composite/publish-java@main
        with:
          is-private: 'false'
          sonatype-user: ${{ secrets.SONATYPE_USER }}
          sonatype-password: ${{ secrets.SONATYPE_PASSWORD }}
          sonatype-gpg-keyid: ${{ secrets.SONATYPE_GPG_KEYID }}
          sonatype-gpg-password: ${{ secrets.SONATYPE_GPG_PASSWORD }}
          sonatype-gpg-file: ${{ secrets.SONATYPE_GPG_FILE }}
